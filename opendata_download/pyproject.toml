# Editable-install metadata for the ECMWF open-data downloader.
#
#     pip install -e .
#
# This package is deliberately model-agnostic: it downloads raw ECMWF GRIB
# fields by short name and knows nothing about GraphCast/FourCastNet variable
# renaming. That mapping lives in the downstream "processing" stage, so every
# forecast-model project can reuse this downloader unchanged.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opendata-download"
version = "0.1.0"
description = "Download ECMWF open-data IFS analysis fields (fc0), reusable across forecast models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ecmwf-opendata>=0.3",
]

[project.scripts]
download-fc0 = "opendata_download.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
